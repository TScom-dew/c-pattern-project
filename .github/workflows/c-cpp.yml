name: C Pattern Build & Run - Windows CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Compile all C files
        shell: msys2 {0}
        run: gcc main.c patterns.c -o pattern_program.exe -Wall

      - name: Run program
        shell: msys2 {0}
        run: ./pattern_program.exe
